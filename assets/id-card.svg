<svg width="800" height="290" viewBox="0 0 800 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-base { fill: #0d1117; rx: 16px; stroke: #30363d; stroke-width: 1.5; }
    .badge-bg { fill: #161b22; rx: 14px; stroke: #8957e5; stroke-dasharray: 4 2; }
    .glow-border { stroke: #58a6ff; stroke-width: 2; animation: borderGlow 3s infinite alternate; }
    @keyframes borderGlow {
      from { stroke: #58a6ff; filter: drop-shadow(0 0 4px #58a6ff); }
      to { stroke: #d2a8ff; filter: drop-shadow(0 0 10px #d2a8ff); }
    }
  </style>

  <rect width="800" height="290" class="card-base"/>

  <!-- Left: Developer ID Lanyard Badge -->
  <line x1="140" y1="0" x2="140" y2="25" stroke="#8957e5" stroke-width="5"/>
  <circle cx="140" cy="27" r="7" fill="#bc8cff"/>
  <rect x="40" y="32" width="200" height="235" class="badge-bg"/>
  
  <!-- Direct GitHub Avatar Feed -->
  <image href="https://github.com/Ajeesh-iv.png" x="90" y="55" width="100" height="100" clip-path="inset(0% round 50px)"/>
  <circle cx="140" cy="105" r="50" fill="none" class="glow-border"/>

  <text x="140" y="180" fill="#f0f6fc" font-size="15" font-weight="700" text-anchor="middle" font-family="-apple-system, sans-serif">Ajeesh</text>
  <text x="140" y="200" fill="#7ee787" font-size="11" text-anchor="middle" font-family="monospace">● AVAILABLE FOR HIRE</text>
  <text x="140" y="222" fill="#8b949e" font-size="11" text-anchor="middle" font-family="-apple-system, sans-serif">Full-Stack &amp; AI Builder</text>

  <!-- Right: Metrics & Focus -->
  <text x="300" y="55" fill="#58a6ff" font-family="monospace" font-size="13">// DEVELOPER OVERVIEW</text>
  <text x="300" y="80" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Profile at a glance</text>

  <rect x="300" y="105" width="130" height="60" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="320" y="132" fill="#f0f6fc" font-size="19" font-weight="bold" font-family="sans-serif">@Ajeesh-iv</text>
  <text x="320" y="152" fill="#8b949e" font-size="12" font-family="sans-serif">GitHub Handle</text>

  <rect x="450" y="105" width="130" height="60" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="470" y="132" fill="#7ee787" font-size="19" font-weight="bold" font-family="sans-serif">Active</text>
  <text x="470" y="152" fill="#8b949e" font-size="12" font-family="sans-serif">Status</text>

  <rect x="600" y="105" width="130" height="60" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="620" y="132" fill="#ff79c6" font-size="19" font-weight="bold" font-family="sans-serif">2026</text>
  <text x="620" y="152" fill="#8b949e" font-size="12" font-family="sans-serif">Edition</text>

  <!-- Skill Bars -->
  <text x="300" y="200" fill="#c9d1d9" font-size="12" font-family="monospace">Frontend &amp; Responsive UI</text>
  <rect x="300" y="210" width="430" height="8" rx="4" fill="#21262d"/>
  <rect x="300" y="210" width="390" height="8" rx="4" fill="#a371f7"/>

  <text x="300" y="240" fill="#c9d1d9" font-size="12" font-family="monospace">Backend, Cloud &amp; Automation</text>
  <rect x="300" y="250" width="430" height="8" rx="4" fill="#21262d"/>
  <rect x="300" y="250" width="350" height="8" rx="4" fill="#58a6ff"/>
</svg>
